syntax = "proto3";

package zmk.device_info;

message GetDeviceInfoRequest {}

// Ask the split central to collect device info from its connected peripheral
// half/halves. The central acknowledges immediately with `Ok`; each
// peripheral's info arrives asynchronously as a PeripheralDeviceInfo
// notification (a peripheral lives in a separate firmware image, so the central
// cannot read it directly). `req_id` is echoed back in every notification so a
// client can correlate replies with the request that triggered them.
message GetPeripheralDeviceInfoRequest { uint32 req_id = 1; }

message Ok {}

message BuildInfo {
    string zmk_version = 1;
    bool zmk_dirty = 2;
    string zmk_config_version = 3;
    bool zmk_config_dirty = 4;
    string module_version = 5;
    bool module_dirty = 6;
    string zephyr_version = 7;
    string build_timestamp = 8;
    string board = 9;
    // GNU build-id (SHA1 of the linked image, hex). Uniquely identifies the
    // ELF/binary this firmware was built from. Empty if unavailable.
    string build_hash = 10;
}

message HardwareInfo {
    string device_id = 1;
    uint32 reset_cause = 2;
    uint32 flash_size_kb = 3;
    uint32 sram_size_kb = 4;
}

message ZephyrDevice {
    string name = 1;
    bool ready = 2;
}

message ZmkConfig {
    string kscan_compatible = 1;
    bool ble_enabled = 2;
    uint32 ble_profile_count = 3;
    bool usb_enabled = 4;
    bool split_enabled = 5;
    string split_role = 6;
    bool display_enabled = 7;
    bool rgb_underglow_enabled = 8;
    bool backlight_enabled = 9;
    bool battery_level_enabled = 10;
}

message RuntimeStatus { uint32 uptime_ms = 1; }

message DeviceInfoResponse {
    BuildInfo build = 1;
    HardwareInfo hardware = 2;
    repeated ZephyrDevice zephyr_devices = 3;
    ZmkConfig zmk_config = 4;
    RuntimeStatus runtime = 5;
}

message ErrorResponse { string message = 1; }

// One page of the Zephyr device list, sent as the payload of a
// PERIPHERAL_INFO_KIND_DEVICES notification. The list is paged so each split
// relay frame stays small; `last_page` marks the final page.
message ZephyrDevicePage {
    repeated ZephyrDevice devices = 1;
    bool last_page = 2;
}

// Firmware-initiated notification carrying ONE group of a split peripheral's
// device info, delivered after a GetPeripheralDeviceInfoRequest. The peripheral's
// device info is split into small groups and relayed one notification at a time
// so each split relay frame stays within CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN
// (kept small on purpose).
//
// `source` is the peripheral index (1-based; the central is 0), `req_id` echoes
// the triggering request, `last` is set on the final notification for this
// source so a client knows the collection is complete, and `kind` says which
// group `payload` holds (see device_info_peripheral_info_kind in
// include/zmk/device_info/relay_events.h — a plain uint32 rather than a proto
// enum to keep the generated TS free of runtime enum syntax):
//   1 = BUILD      -> payload = BuildInfo
//   2 = HARDWARE   -> payload = HardwareInfo
//   3 = ZMK_CONFIG -> payload = ZmkConfig
//   4 = RUNTIME    -> payload = RuntimeStatus
//   5 = DEVICES    -> payload = ZephyrDevicePage
// A peripheral emits one notification per group (build, hardware, config,
// runtime) plus one per device-list page.
message PeripheralDeviceInfo {
    uint32 source = 1;
    uint32 req_id = 2;
    uint32 kind = 3;
    bytes payload = 4;
    bool last = 5;
}

message Request {
    oneof request_type {
        GetDeviceInfoRequest get_device_info = 1;
        GetPeripheralDeviceInfoRequest get_peripheral_device_info = 2;
    }
}

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        DeviceInfoResponse device_info = 2;
        Ok ok = 3;
    }
}
